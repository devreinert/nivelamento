<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <title>Home</title>
</head>
<style>
    body {
        margin: 0;
        padding: 0;
        font-size: 1.2rem;
        font-family: Arial, Helvetica, sans-serif;
        display: flex;
        background-color: #ffff;
        justify-content: center;
        /* centraliza na horizontal */
        align-items: center;
        /* centraliza na vertical */
        min-height: 100vh;
        /* ocupa a tela inteira */
        flex-direction: column;
        /* h1 fica em cima do grid */
    }

    h1 {
        color: #ce93d8;
    }

    img {
        max-width: 100%;
        display: block;
        border-radius: 20px;
    }

    .grid1 {
        display: grid;
        grid-template-columns: 1fr;
        max-width: 1000px;
        grid-gap: 30px;
    }

    .grid1>div:nth-child(n + 0) {
        box-shadow: 10px 10px 10px rgba(0, 0, 0, 0.25);
        border-radius: 20px;

    }

    .grid-item {
        transition: 0.05 ease;
        cursor: pointer;
    }

    .grid1:hover>:not(:hover) {
        opacity: 0.3;
    }

    .grid-item:hover {
        transform: scale(1.1);
    }

    input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border-radius: 12px;
        border: 1px solid #ccc;
        font-size: 14px;
    }

    textarea {
        height: 100px;
        resize: none;
        font-size: 14px;
        width: 100%;
        border-radius: 12px;
        border: 1px solid #ccc;
        padding: 12px;
    }

    a {
        text-decoration: none;
        font-size: 15px;
    }

    p {
        text-align: center;
    }

    .card-link {
        text-decoration: none;
        color: inherit;
    }

    .grid-item img {
        width: 100%;
        height: 120px;
        object-fit: contain;
        /* mantém proporção sem distorcer */
    }

    .grid-item {
        padding: 20px;
        background: white;
        border-radius: 20px;
        transition: 0.2s ease;

    }

    .container-link a {
        text-decoration: none;
        position: absolute;
        top: 10px;
        right: 20px;
        font-size: 15px;
    }

    .menu {
        position: fixed;
        top: 10px;
        right: 20px;
        display: flex;
        gap: 15px;
        list-style: none;


    }
</style>

<body>

    <nav>
        <ul class="menu">
            <li><a class="sair" href="home.html">Home</a></li>
            <li><a class="sair" href="tela-login.html">Sair</a></li>
        </ul>
    </nav>

    <h1>Desabafe sobre sua vida aqui!</h1>

    <section class="grid1">
        <div class="grid-item" data-bs-toggle="modal" data-bs-target="#meuModal">
            <img src="imgs/Img6.png" alt="">
        </div>

    </section>

    <div class="modal fade" id="meuModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Desabafo!</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form name="formulario" id="modelDesabafo">
                        <input type="text" id="tituloFrm" name="tituloFrm"
                            placeholder="Sobre qual assunto você quer conversar?" required>
                        <textarea id="desabafo" name="desabafo" placeholder="Me conta tudo o que te aflinge!"
                            required></textarea>
                        <button type="submit" class="btn btn-success">Enviar</button>

                    </form>
                </div>
                <div class="modal-footer">
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
